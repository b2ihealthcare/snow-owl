name: Java CI

on:
  push:
    branches:
      - 9.x
      - 10.x
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/dependabot.yml'
      - 'Jenkinsfile'
  pull_request:
    branches:
      - 9.x
      - 10.x
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/dependabot.yml'
      - 'Jenkinsfile'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.3

    # Setup the Java environment required for the build
    - name: Set up JDK 25
      uses: actions/setup-java@v5.4.0
      with:
        distribution: temurin
        java-version: 25
        architecture: x64

    # Cache .m2 and node_modules dependencies
    - name: Cache Maven Dependencies (~/.m2/repository)
      uses: actions/cache@v5.0.5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('**/*.target') }}
        restore-keys: |
          ${{ runner.os }}-maven-:
    - name: Cache NPM Dependencies (core/com.b2international.snowowl.core.rest/snow-owl-api-docs/node_modules)
      uses: actions/cache@v5.0.5
      with:
        path: core/com.b2international.snowowl.core.rest/snow-owl-api-docs/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('core/com.b2international.snowowl.core.rest/snow-owl-api-docs/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-:

    # Run the build
    - name: Build with Maven
      run: ./mvnw ${{ env.MAVEN_SWITCHES }} clean verify
      env:
        MAVEN_OPTS: '-Dstyle.color=always'
        MAVEN_SWITCHES: >-
          --show-version
          --no-transfer-progress
          --update-snapshots
          --batch-mode

    # Upload Code Coverage
    - name: Upload Codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
